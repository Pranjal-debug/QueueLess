services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: queueless
      POSTGRES_PASSWORD: "mmXIjNZgOPFyOb1tPy9vF0sOnopDNOSg"
    volumes:
      - queueless_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "3niID-16nvRznP2vLrrYzvgkyqhgCaUs"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: queueless_test
      POSTGRES_PASSWORD: "2Xl2nS87DQ8Q8P8YOSkPXM029VsHVX-M"
    volumes:
      - queueless_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "R0RdMxDnROVc_C3HjfzQawFBcvrWG4zA"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  queueless_data:
  queueless_test_data:
